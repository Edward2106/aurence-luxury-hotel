<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rooms — Admin</title><link rel="stylesheet" href="../assets/css/style.css" /></head>
<body data-admin="rooms" data-no-concierge>
<div class="admin-shell"><div data-admin-nav></div>
  <main class="admin-main">
    <div class="admin-head"><div><div class="eyebrow">Housekeeping</div><h1>Rooms</h1></div>
      <div class="pill-nav"><a href="#" class="active" data-f="all">All</a><a href="#" data-f="Available">Available</a><a href="#" data-f="Occupied">Occupied</a><a href="#" data-f="Cleaning">Cleaning</a><a href="#" data-f="Maintenance">Maintenance</a></div>
    </div>
    <div class="grid grid-3" id="rooms"></div>
  </main>
</div>
<script src="../assets/js/data.js"></script><script src="../assets/js/admin.js"></script>
<script>
  const rooms = AURENCE.rooms.concat(AURENCE.rooms.map(r => ({ ...r, id: r.id + "-b" })));
  function render(f) {
    const list = f === "all" ? rooms : rooms.filter(r => r.status === f);
    document.getElementById("rooms").innerHTML = list.map(r => `
      <div class="card">
        <div class="card-media"><img src="${r.image}" /><span class="card-badge">Room ${r.id.toUpperCase()}</span></div>
        <div class="card-body">
          <b style="font-family:var(--font-display);font-size:1.1rem">${r.name}</b>
          <div class="muted" style="font-size:0.85rem">${r.size} · ${r.beds} · $${r.price}/night</div>
          <div class="flex justify-between mt-2"><span class="status ${r.status.toLowerCase()}">${r.status}</span><button class="btn btn-outline btn-sm">Manage</button></div>
        </div>
      </div>`).join("");
  }
  render("all");
  document.querySelectorAll(".pill-nav a").forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault(); document.querySelectorAll(".pill-nav a").forEach(x => x.classList.remove("active"));
    a.classList.add("active"); render(a.dataset.f);
  }));
</script>
</body></html>
