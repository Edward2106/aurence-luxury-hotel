<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bookings — Admin</title><link rel="stylesheet" href="../assets/css/style.css" /></head>
<body data-admin="bookings" data-no-concierge>
<div class="admin-shell"><div data-admin-nav></div>
<main class="admin-main">
<div class="admin-head"><div><div class="eyebrow">Reservations</div><h1>Bookings</h1></div>
  <div class="flex gap-2"><input class="input" id="q" placeholder="Search…" style="width:220px" /><button class="btn btn-primary">+ New</button></div>
</div>
<div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>Customer</th><th>Hotel</th><th>Room</th><th>Dates</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/admin.js"></script>
<script>
  const { LS, bookings: seed } = AURENCE;
  function render(q="") {
    const list = LS.get("aurence.bookings", seed).filter(b => (b.id+b.customer+b.hotel).toLowerCase().includes(q.toLowerCase()));
    document.getElementById("tb").innerHTML = list.map(b => `
      <tr><td>${b.id}</td><td>${b.customer}</td><td>${b.hotel}</td><td>${b.room}</td><td>${b.checkIn} → ${b.checkOut}</td><td>$${b.total.toLocaleString()}</td>
      <td><span class="status ${b.status.toLowerCase()}">${b.status}</span></td>
      <td><button class="btn btn-outline btn-sm" data-a="a" data-i="${b.id}">Approve</button> <button class="btn btn-ghost btn-sm" data-a="r" data-i="${b.id}">Reject</button></td></tr>`).join("");
    document.querySelectorAll("[data-a]").forEach(btn => btn.addEventListener("click", () => {
      const list2 = LS.get("aurence.bookings", seed);
      const it = list2.find(x => x.id === btn.dataset.i);
      it.status = btn.dataset.a === "a" ? "Confirmed" : "Cancelled";
      LS.set("aurence.bookings", list2); render(document.getElementById("q").value);
    }));
  }
  render();
  document.getElementById("q").addEventListener("input", (e) => render(e.target.value));
</script>
</body></html>
