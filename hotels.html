<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Danh sách khách sạn — Bộ sưu tập Aurence</title>
<meta name="description" content="Xem qua bộ sưu tập khách sạn sang trọng của Aurence trên khắp Việt Nam. Lọc theo tiện ích, xếp hạng sao và mức giá." />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  /* Custom styles for detailed hotel cards in listing */
  .hotel-card {
    background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-soft);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    display: flex; flex-direction: column; cursor: pointer; position: relative;
  }
  .hotel-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-luxe); }
  .hotel-card-media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
  .hotel-card-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
  .hotel-card:hover .hotel-card-media img { transform: scale(1.07); }
  .fav-btn {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255,255,255,0.85); color: var(--danger);
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; border: none; cursor: pointer; z-index: 10;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .fav-btn:hover { transform: scale(1.1); background: #fff; }
  .hotel-card-body { padding: 1.25rem 1.35rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
  .hotel-card-title { font-family: var(--font-display); font-size: 1.35rem; }
  .hotel-card-meta { color: var(--muted); font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; }
  .hotel-card-facilities { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: auto; padding-top: 0.75rem; }
  .hotel-card-foot { display: flex; flex-direction: column; gap: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); margin-top: 0.75rem; }
  .hotel-card-price-row { display: flex; align-items: baseline; justify-content: space-between; }
  .hotel-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
</style>
</head>
<body data-page="hotels">
<div data-nav></div>

<header class="page-head" style="padding-top:7rem">
  <div class="container">
    <div class="eyebrow">Bộ sưu tập</div>
    <h1 class="mt-1">Mọi kỳ nghỉ, đều tinh tế và độc bản.</h1>
    <p>Lọc qua các khách sạn sang trọng hàng đầu Việt Nam với trải nghiệm tinh tuyển.</p>
  </div>
</header>

<section class="container section-tight">
  <div class="layout-listing">
    <aside class="filter-panel">
      <h4>Tìm kiếm</h4>
      <input class="input" id="f-q" placeholder="Địa điểm, khách sạn..." />
      
      <h4>Giá phòng / đêm</h4>
      <div class="flex gap-2">
        <input class="input" id="f-min" type="number" placeholder="Từ (VND)" />
        <input class="input" id="f-max" type="number" placeholder="Đến (VND)" />
      </div>
      
      <h4>Hạng sao</h4>
      <div id="f-stars">
        <label class="check-row"><input type="checkbox" value="5" /> 5 sao</label>
        <label class="check-row"><input type="checkbox" value="4" /> 4 sao</label>
      </div>
      
      <h4>Tiện ích</h4>
      <div id="f-fac">
        <label class="check-row"><input type="checkbox" value="Hồ bơi" /> Hồ bơi</label>
        <label class="check-row"><input type="checkbox" value="Spa" /> Spa</label>
        <label class="check-row"><input type="checkbox" value="Nhà hàng" /> Nhà hàng</label>
        <label class="check-row"><input type="checkbox" value="Phòng gym" /> Phòng gym</label>
        <label class="check-row"><input type="checkbox" value="Wi-Fi miễn phí" /> Wi-Fi</label>
        <label class="check-row"><input type="checkbox" value="Bãi đậu xe" /> Bãi đậu xe</label>
      </div>
      
      <button class="btn btn-navy btn-block mt-3" id="apply-filter">Áp dụng bộ lọc</button>
      <button class="btn btn-ghost btn-block" id="reset-filter">Đặt lại</button>
    </aside>
    
    <div>
      <div class="section-head mb-2">
        <div class="muted" id="count">0 khách sạn tìm thấy</div>
        <select class="select" id="sort" style="max-width:220px">
          <option value="pop">Sắp xếp: Đề xuất</option>
          <option value="low">Giá: Từ thấp đến cao</option>
          <option value="high">Giá: Từ cao đến thấp</option>
          <option value="rating">Đánh giá cao nhất</option>
        </select>
      </div>
      <div class="grid grid-2" id="grid"></div>
    </div>
  </div>
</section>

<div data-footer></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  const { LS } = AURENCE;
  
  // Dynamic load from localStorage so it respects admin edits
  let hotelsList = LS.get("aurence.hotels", AURENCE.hotels);

  // Pre-fill filter destination from URL parameter or localStorage search
  const params = new URLSearchParams(location.search);
  const urlQuery = params.get("q");
  
  if (urlQuery) {
    document.getElementById("f-q").value = urlQuery;
  } else {
    const searchData = LS.get("aurence.search");
    if (searchData && searchData.destination) {
      document.getElementById("f-q").value = searchData.destination;
    }
  }

  // Get active profile for favorites
  function getFavorites() {
    const profile = LS.get("aurence.profile", {});
    return profile.favorites || [];
  }

  function toggleFavorite(hotelId, event) {
    event.stopPropagation(); // prevent card click redirect
    const profile = LS.get("aurence.profile", {});
    if (!profile.favorites) profile.favorites = [];
    
    const index = profile.favorites.indexOf(hotelId);
    if (index > -1) {
      profile.favorites.splice(index, 1);
      toast("Đã xóa khỏi danh sách yêu thích");
    } else {
      profile.favorites.push(hotelId);
      toast("Đã thêm vào danh sách yêu thích");
    }
    LS.set("aurence.profile", profile);
    apply();
  }

  // Custom detailed card renderer
  function renderDetailedHotelCard(h) {
    const stars = "★".repeat(h.stars || 5);
    const isFav = getFavorites().includes(h.id);
    const favIcon = isFav ? "♥" : "♡";
    const priceFormatted = window.formatVND ? window.formatVND(h.price) : (h.price.toLocaleString() + " ₫");
    
    return `
      <div class="hotel-card fade-up" onclick="location.href='hotel.html?id=${h.id}'">
        <button class="fav-btn" title="Yêu thích" onclick="toggleFavorite('${h.id}', event)">${favIcon}</button>
        <div class="hotel-card-media">
          <img src="${h.image}" alt="${h.name}" loading="lazy" />
          <span class="card-badge">${h.country}</span>
        </div>
        <div class="hotel-card-body">
          <div class="hotel-card-title">${h.name}</div>
          <div class="hotel-card-meta">◉ ${h.location}</div>
          <div class="rating">${stars} <span class="muted" style="font-size:0.8rem">${h.rating} · ${h.reviews} đánh giá</span></div>
          <div class="hotel-card-facilities">
            ${h.facilities.slice(0, 4).map(f => `<span class="chip">${f}</span>`).join("")}
          </div>
          <div class="hotel-card-foot">
            <div class="hotel-card-price-row">
              <span class="price">${priceFormatted}<small> / đêm</small></span>
            </div>
            <div class="hotel-card-actions">
              <a class="btn btn-sm btn-outline" href="hotel.html?id=${h.id}" onclick="event.stopPropagation();">Xem chi tiết</a>
              <a class="btn btn-sm btn-primary" href="booking.html?hotel=${h.id}" onclick="event.stopPropagation();">Đặt phòng</a>
            </div>
          </div>
        </div>
      </div>`;
  }

  function apply() {
    // Reload from storage in case changes occurred
    hotelsList = LS.get("aurence.hotels", AURENCE.hotels);

    const q = document.getElementById("f-q").value.toLowerCase().trim();
    const min = parseFloat(document.getElementById("f-min").value) || 0;
    const max = parseFloat(document.getElementById("f-max").value) || Infinity;
    const stars = Array.from(document.querySelectorAll("#f-stars input:checked")).map(i => parseInt(i.value));
    const facs = Array.from(document.querySelectorAll("#f-fac input:checked")).map(i => i.value);
    const sort = document.getElementById("sort").value;

    let list = hotelsList.filter(h => {
      const matchQuery = !q || (h.name + h.location + h.country).toLowerCase().includes(q);
      const matchPrice = h.price >= min && h.price <= max;
      const matchStars = stars.length === 0 || stars.includes(h.stars);
      const matchFacs = facs.every(f => h.facilities.includes(f));
      
      return matchQuery && matchPrice && matchStars && matchFacs;
    });

    // Sorting
    if (sort === "low") list.sort((a, b) => a.price - b.price);
    if (sort === "high") list.sort((a, b) => b.price - a.price);
    if (sort === "rating") list.sort((a, b) => b.rating - a.rating);

    // Display count
    document.getElementById("count").textContent = `${list.length} khách sạn tìm thấy`;

    // Render grid
    const grid = document.getElementById("grid");
    if (list.length === 0) {
      grid.innerHTML = `<div style="grid-column: span 2; text-align: center; padding: 3rem 0;" class="muted">Không tìm thấy khách sạn nào khớp với bộ lọc của bạn.</div>`;
    } else {
      grid.innerHTML = list.map(renderDetailedHotelCard).join("");
    }
  }

  document.getElementById("apply-filter").addEventListener("click", apply);
  document.getElementById("sort").addEventListener("change", apply);
  
  document.getElementById("reset-filter").addEventListener("click", () => {
    document.getElementById("f-q").value = "";
    document.getElementById("f-min").value = "";
    document.getElementById("f-max").value = "";
    document.querySelectorAll(".filter-panel input[type='checkbox']").forEach(i => i.checked = false);
    
    // Clear search in localStorage
    LS.set("aurence.search", null);
    
    apply();
  });

  // Initial trigger
  apply();
</script>
</body>
</html>
