<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quản lý Nhân sự — Admin Aurence</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 21, 48, 0.7);
    display: none; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 20px; padding: 2rem; max-width: 550px; width: 90%;
    box-shadow: var(--shadow-luxe); border: 1px solid var(--border);
  }
  .filter-row { display: flex; gap: 0.75rem; margin-top: 1rem; align-items: center; }
</style>
</head>
<body data-admin="employees" data-no-concierge>
<div class="admin-shell"><div data-admin-nav></div>
<main class="admin-main">
  <div class="admin-head">
    <div><div class="eyebrow">Hệ thống nhân sự</div><h1>Nhân viên</h1></div>
    <button class="btn btn-primary" id="add-emp-btn">+ Thêm nhân viên</button>
  </div>

  <div class="filter-row">
    <select class="select" id="role-filter" style="max-width:200px;">
      <option value="all">Tất cả vai trò</option>
      <option value="Quản trị viên">Quản trị viên</option>
      <option value="Lễ tân">Lễ tân</option>
      <option value="Nhân viên buồng phòng">Nhân viên buồng phòng</option>
      <option value="Nhân viên dịch vụ">Nhân viên dịch vụ</option>
      <option value="Quản lý khách sạn">Quản lý khách sạn</option>
    </select>
    <input class="input" id="search-emp" placeholder="Tìm tên nhân viên..." style="max-width:250px; margin-left:auto;" />
  </div>

  <div class="table-wrap mt-3">
    <table class="data">
      <thead>
        <tr>
          <th>Mã NV</th>
          <th>Họ và tên</th>
          <th>Vai trò</th>
          <th>Khách sạn</th>
          <th>Ca trực</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</main>
</div>

<!-- Add/Edit Employee Modal -->
<div class="modal-overlay" id="emp-modal">
  <div class="modal-box">
    <h3 id="modal-title" style="color:var(--navy);">Thêm nhân viên mới</h3>
    <form id="emp-form" class="mt-3">
      <input type="hidden" id="emp-edit-id" />
      <div class="grid grid-2">
        <div class="field" style="grid-column: span 2;">
          <label>Họ và tên nhân viên</label>
          <input class="input" id="e-name" required />
        </div>
        <div class="field">
          <label>Vai trò / Bộ phận</label>
          <select class="select" id="e-role" required>
            <option value="Quản trị viên">Quản trị viên</option>
            <option value="Lễ tân">Lễ tân</option>
            <option value="Nhân viên buồng phòng">Nhân viên buồng phòng</option>
            <option value="Nhân viên dịch vụ">Nhân viên dịch vụ</option>
            <option value="Quản lý khách sạn">Quản lý khách sạn</option>
          </select>
        </div>
        <div class="field">
          <label>Khách sạn làm việc</label>
          <select class="select" id="e-hotel" required></select>
        </div>
        <div class="field">
          <label>Phân công ca trực</label>
          <select class="select" id="e-shift" required>
            <option value="Ca sáng">Ca sáng (06:00 - 14:00)</option>
            <option value="Ca chiều">Ca chiều (14:00 - 22:00)</option>
            <option value="Ca tối">Ca tối (22:00 - 06:00)</option>
          </select>
        </div>
        <div class="field">
          <label>Trạng thái làm việc</label>
          <select class="select" id="e-status" required>
            <option value="Hoạt động">Hoạt động (Active)</option>
            <option value="Nghỉ phép">Nghỉ phép (On Leave)</option>
            <option value="Tạm nghỉ">Tạm nghỉ (Off Duty)</option>
          </select>
        </div>
      </div>
      <div class="mt-4 flex gap-2 justify-end">
        <button type="button" class="btn btn-outline" id="close-modal-btn">Hủy bỏ</button>
        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  const { LS } = AURENCE;
  
  let employees = [];
  let hotels = [];

  function loadEmployeesData() {
    employees = LS.get("aurence.employees", AURENCE.employees);
    hotels = LS.get("aurence.hotels", AURENCE.hotels);

    // Populate hotels dropdown inside modal
    const hotelSelect = document.getElementById("e-hotel");
    hotelSelect.innerHTML = `<option value="Tất cả">Tất cả khách sạn</option>` + 
      hotels.map(h => `<option value="${h.name}">${h.name}</option>`).join("");

    render();
  }

  function render() {
    const tableBody = document.getElementById("tb");
    const searchVal = document.getElementById("search-emp").value.toLowerCase().trim();
    const roleVal = document.getElementById("role-filter").value;

    const filtered = employees.filter(e => {
      const matchSearch = !searchVal || e.name.toLowerCase().includes(searchVal);
      const matchRole = roleVal === "all" || e.role === roleVal;
      
      return matchSearch && matchRole;
    });

    tableBody.innerHTML = filtered.map(e => {
      const statusClass = e.status === "Hoạt động" ? "confirmed" : e.status === "Nghỉ phép" ? "pending" : "cancelled";
      return `
        <tr>
          <td><code style="font-weight:600; color:var(--navy);">${e.id}</code></td>
          <td><b>${e.name}</b></td>
          <td><b>${e.role}</b></td>
          <td>${e.hotel}</td>
          <td>${e.shift}</td>
          <td><span class="status ${statusClass}">${e.status}</span></td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="openEditModal('${e.id}')">Sửa</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteEmployee('${e.id}')">Xóa</button>
          </td>
        </tr>`;
    }).join("");
  }

  // Handle Search & Filter
  document.getElementById("search-emp").addEventListener("input", render);
  document.getElementById("role-filter").addEventListener("change", render);

  // Modal Setup
  const modal = document.getElementById("emp-modal");
  const openModalBtn = document.getElementById("add-emp-btn");
  const closeModalBtn = document.getElementById("close-modal-btn");
  const form = document.getElementById("emp-form");

  openModalBtn.addEventListener("click", () => {
    form.reset();
    document.getElementById("emp-edit-id").value = "";
    document.getElementById("modal-title").textContent = "Thêm nhân viên mới";
    modal.classList.add("open");
  });

  closeModalBtn.addEventListener("click", () => {
    modal.classList.remove("open");
  });

  // Edit employee
  window.openEditModal = function(id) {
    const e = employees.find(x => x.id === id);
    if (!e) return;

    document.getElementById("emp-edit-id").value = e.id;
    document.getElementById("modal-title").textContent = "Chỉnh sửa thông tin nhân viên";
    document.getElementById("e-name").value = e.name;
    document.getElementById("e-role").value = e.role;
    document.getElementById("e-hotel").value = e.hotel;
    document.getElementById("e-shift").value = e.shift;
    document.getElementById("e-status").value = e.status;

    modal.classList.add("open");
  };

  // Delete employee
  window.deleteEmployee = function(id) {
    if (!confirm("Bạn có chắc chắn muốn xóa nhân viên này khỏi hệ thống?")) return;

    employees = employees.filter(e => e.id !== id);
    LS.set("aurence.employees", employees);
    
    toast("Đã xóa nhân viên thành công.");
    loadEmployeesData();
  };

  // Submit Form
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    
    const editId = document.getElementById("emp-edit-id").value;
    const name = document.getElementById("e-name").value.trim();
    const role = document.getElementById("e-role").value;
    const hotel = document.getElementById("e-hotel").value;
    const shift = document.getElementById("e-shift").value;
    const status = document.getElementById("e-status").value;

    if (editId) {
      // Edit
      const idx = employees.findIndex(e => e.id === editId);
      if (idx > -1) {
        employees[idx] = {
          ...employees[idx],
          name, role, hotel, shift, status
        };
      }
    } else {
      // Add
      const newId = "NV" + Math.floor(100 + Math.random() * 900);
      employees.push({
        id: newId,
        name, role, hotel, shift, status
      });
    }

    LS.set("aurence.employees", employees);
    modal.classList.remove("open");
    toast(editId ? "Đã cập nhật hồ sơ nhân viên." : "Đã thêm nhân viên mới thành công.");
    loadEmployeesData();
  });

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast show";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  // Initial trigger
  loadEmployeesData();
</script>
</body>
</html>
