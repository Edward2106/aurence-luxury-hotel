<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quản lý Khách sạn — Admin Aurence</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 21, 48, 0.7);
    display: none; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 20px; padding: 2rem; max-width: 600px; width: 90%;
    box-shadow: var(--shadow-luxe); border: 1px solid var(--border);
    max-height: 90vh; overflow-y: auto;
  }
  .preview-img-box { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); display: none; }
</style>
</head>
<body data-admin="hotels" data-no-concierge>
<div class="admin-shell">
  <div data-admin-nav></div>
  <main class="admin-main">
    <div class="admin-head">
      <div><div class="eyebrow">Quản lý kho</div><h1>Khách sạn</h1></div>
      <div class="flex gap-2">
        <input class="input" id="search-hotel" placeholder="Tìm kiếm khách sạn..." style="width: 250px;" />
        <button class="btn btn-primary" id="add-hotel-btn">+ Thêm khách sạn</button>
      </div>
    </div>
    
    <div class="table-wrap mt-3">
      <table class="data">
        <thead>
          <tr>
            <th>Khách sạn</th>
            <th>Vị trí</th>
            <th>Số phòng</th>
            <th>Xếp hạng</th>
            <th>Giá phòng TB</th>
            <th>Lấp đầy</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add/Edit Hotel Modal -->
<div class="modal-overlay" id="hotel-modal">
  <div class="modal-box">
    <h3 id="modal-title" style="color:var(--navy);">Thêm khách sạn mới</h3>
    <form id="hotel-form" class="mt-3">
      <input type="hidden" id="hotel-edit-id" />
      <div class="grid grid-2">
        <div class="field" style="grid-column: span 2;">
          <label>Tên khách sạn</label>
          <input class="input" id="h-name" required />
        </div>
        <div class="field">
          <label>Vị trí (Quận, Thành phố)</label>
          <input class="input" id="h-loc" placeholder="Ví dụ: Bãi biển Mỹ Khê, Đà Nẵng..." required />
        </div>
        <div class="field">
          <label>Quốc gia</label>
          <input class="input" id="h-country" value="Việt Nam" required />
        </div>
        <div class="field">
          <label>Giá phòng tối thiểu (VND)</label>
          <input class="input" type="number" id="h-price" required />
        </div>
        <div class="field">
          <label>Số sao xếp hạng</label>
          <select class="select" id="h-stars">
            <option value="5">5 sao</option>
            <option value="4">4 sao</option>
            <option value="3">3 sao</option>
          </select>
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>Mô tả khách sạn</label>
          <textarea class="textarea" id="h-desc" required></textarea>
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>Tiện ích (Lựa chọn nhiều)</label>
          <div class="grid grid-3" id="facilities-checkboxes" style="background:var(--bg); padding:0.75rem; border-radius:10px;">
            <label class="check-row"><input type="checkbox" value="Hồ bơi" /> Hồ bơi</label>
            <label class="check-row"><input type="checkbox" value="Spa" /> Spa</label>
            <label class="check-row"><input type="checkbox" value="Nhà hàng" /> Nhà hàng</label>
            <label class="check-row"><input type="checkbox" value="Phòng gym" /> Phòng gym</label>
            <label class="check-row"><input type="checkbox" value="Wi-Fi miễn phí" /> Wi-Fi</label>
            <label class="check-row"><input type="checkbox" value="Bãi đậu xe" /> Bãi đậu xe</label>
          </div>
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>Hình ảnh khách sạn (Tải lên)</label>
          <input type="file" id="h-img-input" accept="image/*" class="input" style="padding:0.5rem;" />
          <div class="mt-2">
            <img class="preview-img-box" id="h-img-preview" />
          </div>
        </div>
      </div>
      <div class="mt-4 flex gap-2 justify-end">
        <button type="button" class="btn btn-outline" id="close-modal-btn">Hủy bỏ</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Lưu thông tin</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  const { LS } = AURENCE;
  
  let hotels = [];
  let rooms = [];
  let currentBase64Image = "";

  function loadHotels() {
    hotels = LS.get("aurence.hotels", AURENCE.hotels);
    rooms = LS.get("aurence.rooms", AURENCE.rooms);
    
    renderHotelsTable();
  }

  function renderHotelsTable(filterQuery = "") {
    const tableBody = document.getElementById("tb");
    const q = filterQuery.toLowerCase().trim();

    const filtered = hotels.filter(h => h.name.toLowerCase().includes(q) || h.location.toLowerCase().includes(q));

    tableBody.innerHTML = filtered.map(h => {
      // Calculate dynamic room count
      const hotelRooms = rooms.filter(r => r.hotelId === h.id);
      const roomCount = hotelRooms.length;
      
      // Calculate occupancy
      const occupiedRooms = hotelRooms.filter(r => r.status === "Đang sử dụng" || r.status === "Đã đặt");
      const occupancyRate = hotelRooms.length > 0 ? Math.round((occupiedRooms.length / hotelRooms.length) * 100) : 0;

      const formatVND = (v) => new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" }).format(v);

      return `
        <tr>
          <td>
            <div style="display:flex;gap:0.75rem;align-items:center">
              <img src="${h.image}" style="width:48px;height:48px;border-radius:8px;object-fit:cover" />
              <b>${h.name}</b>
            </div>
          </td>
          <td>${h.location}, ${h.country}</td>
          <td><b>${roomCount}</b> phòng</td>
          <td><span style="color:var(--gold);">${"★".repeat(h.stars || 5)}</span></td>
          <td><b>${formatVND(h.price)}</b></td>
          <td><b>${occupancyRate}%</b></td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="openEditHotelModal('${h.id}')">Sửa</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteHotel('${h.id}')">Xóa</button>
          </td>
        </tr>`;
    }).join("");
  }

  // Handle Search
  document.getElementById("search-hotel").addEventListener("input", (e) => {
    renderHotelsTable(e.target.value);
  });

  // Modal setups
  const modal = document.getElementById("hotel-modal");
  const openModalBtn = document.getElementById("add-hotel-btn");
  const closeModalBtn = document.getElementById("close-modal-btn");
  const form = document.getElementById("hotel-form");
  const imgInput = document.getElementById("h-img-input");
  const imgPreview = document.getElementById("h-img-preview");

  openModalBtn.addEventListener("click", () => {
    form.reset();
    document.getElementById("hotel-edit-id").value = "";
    document.getElementById("modal-title").textContent = "Thêm khách sạn mới";
    imgPreview.style.display = "none";
    currentBase64Image = "";
    
    // Clear checkboxes
    document.querySelectorAll("#facilities-checkboxes input").forEach(chk => chk.checked = false);
    
    modal.classList.add("open");
  });

  closeModalBtn.addEventListener("click", () => {
    modal.classList.remove("open");
  });

  // Handle Image Upload preview
  imgInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      currentBase64Image = event.target.result;
      imgPreview.src = currentBase64Image;
      imgPreview.style.display = "block";
    };
    reader.readAsDataURL(file);
  });

  // Open Edit Modal
  window.openEditHotelModal = function(id) {
    const h = hotels.find(x => x.id === id);
    if (!h) return;

    document.getElementById("hotel-edit-id").value = h.id;
    document.getElementById("modal-title").textContent = "Chỉnh sửa thông tin khách sạn";
    document.getElementById("h-name").value = h.name;
    document.getElementById("h-loc").value = h.location;
    document.getElementById("h-country").value = h.country;
    document.getElementById("h-price").value = h.price;
    document.getElementById("h-stars").value = h.stars || 5;
    document.getElementById("h-desc").value = h.description;

    // Checkboxes
    document.querySelectorAll("#facilities-checkboxes input").forEach(chk => {
      chk.checked = h.facilities.includes(chk.value);
    });

    // Image preview
    currentBase64Image = h.image;
    imgPreview.src = h.image;
    imgPreview.style.display = "block";

    modal.classList.add("open");
  };

  // Delete hotel
  window.deleteHotel = function(id) {
    if (!confirm("Bạn có chắc chắn muốn xóa khách sạn này? Điều này sẽ xóa vĩnh viễn khỏi danh sách hệ thống.")) return;

    hotels = hotels.filter(h => h.id !== id);
    LS.set("aurence.hotels", hotels);
    
    // Also cascade delete rooms associated with this hotel
    rooms = rooms.filter(r => r.hotelId !== id);
    LS.set("aurence.rooms", rooms);

    const toastDiv = document.createElement("div");
    toastDiv.className = "toast show";
    toastDiv.textContent = "Đã xóa khách sạn thành công.";
    document.body.appendChild(toastDiv);
    setTimeout(() => toastDiv.remove(), 2000);

    loadHotels();
  };

  // Submit form (Add or Edit)
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    
    const editId = document.getElementById("hotel-edit-id").value;
    const name = document.getElementById("h-name").value.trim();
    const location = document.getElementById("h-loc").value.trim();
    const country = document.getElementById("h-country").value.trim();
    const price = parseFloat(document.getElementById("h-price").value);
    const stars = parseInt(document.getElementById("h-stars").value);
    const description = document.getElementById("h-desc").value.trim();

    // Facilities array
    const facilities = Array.from(document.querySelectorAll("#facilities-checkboxes input:checked")).map(chk => chk.value);

    // Image check
    if (!currentBase64Image) {
      alert("Vui lòng tải lên ảnh minh họa cho khách sạn.");
      return;
    }

    if (editId) {
      // Edit mode
      const hIdx = hotels.findIndex(x => x.id === editId);
      if (hIdx > -1) {
        hotels[hIdx] = {
          ...hotels[hIdx],
          name, location, country, price, stars, description, facilities,
          image: currentBase64Image,
          // preserve gallery if it had it, or update it
          gallery: hotels[hIdx].gallery.length > 0 ? [currentBase64Image, ...hotels[hIdx].gallery.slice(1)] : [currentBase64Image]
        };
      }
    } else {
      // Add mode
      // Generate ID
      const newId = "HT" + Math.floor(100 + Math.random() * 900);
      hotels.push({
        id: newId,
        name, location, country, price, rating: 5.0, reviews: 0,
        image: currentBase64Image,
        gallery: [currentBase64Image],
        facilities, description, stars
      });
    }

    LS.set("aurence.hotels", hotels);
    modal.classList.remove("open");
    
    const toastDiv = document.createElement("div");
    toastDiv.className = "toast show";
    toastDiv.textContent = editId ? "Đã cập nhật khách sạn." : "Đã thêm khách sạn mới.";
    document.body.appendChild(toastDiv);
    setTimeout(() => toastDiv.remove(), 2000);

    loadHotels();
  });

  // Initial trigger
  loadHotels();
</script>
</body>
</html>
