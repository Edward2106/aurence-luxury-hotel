<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quản lý Phòng nghỉ — Admin Aurence</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .admin-head-controls { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; align-items: center; }
  .pill-nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .pill-nav a { padding: 0.5rem 1rem; border-radius: 999px; background: #fff; border: 1px solid var(--border); font-size: 0.85rem; font-weight: 500; }
  .pill-nav a.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 21, 48, 0.7);
    display: none; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 20px; padding: 2rem; max-width: 550px; width: 90%;
    box-shadow: var(--shadow-luxe); border: 1px solid var(--border);
    max-height: 90vh; overflow-y: auto;
  }
  .preview-img-box { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; display: none; }
</style>
</head>
<body data-admin="rooms" data-no-concierge>
<div class="admin-shell">
  <div data-admin-nav></div>
  <main class="admin-main">
    <div class="admin-head">
      <div><div class="eyebrow">Quản lý kho</div><h1>Phòng nghỉ</h1></div>
      <button class="btn btn-primary" id="add-room-btn">+ Thêm phòng mới</button>
    </div>

    <div class="admin-head-controls">
      <div class="pill-nav" id="status-filter">
        <a href="#" class="active" data-f="all">Tất cả</a>
        <a href="#" data-f="Còn trống">Còn trống</a>
        <a href="#" data-f="Đã đặt">Đã đặt</a>
        <a href="#" data-f="Đang sử dụng">Đang sử dụng</a>
        <a href="#" data-f="Đang dọn dẹp">Đang dọn dẹp</a>
        <a href="#" data-f="Đang bảo trì">Đang bảo trì</a>
      </div>
      <div class="flex gap-2" style="margin-left:auto;">
        <select class="select" id="hotel-filter" style="width:200px;"><option value="all">Tất cả khách sạn</option></select>
        <input class="input" id="search-room" placeholder="Số phòng, loại phòng..." style="width:200px;" />
      </div>
    </div>

    <div class="grid grid-3 mt-3" id="rooms-grid"></div>
  </main>
</div>

<!-- Add/Edit Room Modal -->
<div class="modal-overlay" id="room-modal">
  <div class="modal-box">
    <h3 id="modal-title" style="color:var(--navy);">Thêm phòng mới</h3>
    <form id="room-form" class="mt-3">
      <input type="hidden" id="room-edit-id" />
      <div class="grid grid-2">
        <div class="field">
          <label>Số phòng</label>
          <input class="input" id="r-num" placeholder="Ví dụ: 101, V-01..." required />
        </div>
        <div class="field">
          <label>Khách sạn</label>
          <select class="select" id="r-hotel" required></select>
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>Tên loại phòng</label>
          <input class="input" id="r-name" placeholder="Ví dụ: Phòng Deluxe Hướng Biển..." required />
        </div>
        <div class="field">
          <label>Diện tích</label>
          <input class="input" id="r-size" placeholder="Ví dụ: 48 m²" required />
        </div>
        <div class="field">
          <label>Loại giường</label>
          <input class="input" id="r-beds" placeholder="Ví dụ: 1 Giường King, 2 Giường Đơn..." required />
        </div>
        <div class="field">
          <label>Sức chứa tối đa (người)</label>
          <input class="input" type="number" min="1" id="r-capacity" required />
        </div>
        <div class="field">
          <label>Giá phòng / đêm (VND)</label>
          <input class="input" type="number" id="r-price" required />
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>Trạng thái buồng phòng</label>
          <select class="select" id="r-status">
            <option value="Còn trống">Còn trống (Available)</option>
            <option value="Đã đặt">Đã đặt (Booked)</option>
            <option value="Đang sử dụng">Đang sử dụng (Occupied)</option>
            <option value="Đang dọn dẹp">Đang dọn dẹp (Cleaning)</option>
            <option value="Đang bảo trì">Đang bảo trì (Maintenance)</option>
          </select>
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>Hình ảnh phòng (Tải lên)</label>
          <input type="file" id="r-img-input" accept="image/*" class="input" style="padding:0.5rem;" />
          <div class="mt-2">
            <img class="preview-img-box" id="r-img-preview" />
          </div>
        </div>
      </div>
      <div class="mt-4 flex gap-2 justify-end">
        <button type="button" class="btn btn-outline" id="close-modal-btn">Hủy bỏ</button>
        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  const { LS } = AURENCE;
  
  let rooms = [];
  let hotels = [];
  let currentBase64Image = "";
  let activeStatusFilter = "all";

  function loadRoomsData() {
    rooms = LS.get("aurence.rooms", AURENCE.rooms);
    hotels = LS.get("aurence.hotels", AURENCE.hotels);

    // Populate hotel filter dropdown
    const filterSelect = document.getElementById("hotel-filter");
    filterSelect.innerHTML = `<option value="all">Tất cả khách sạn</option>` + 
      hotels.map(h => `<option value="${h.id}">${h.name}</option>`).join("");

    renderRooms();
  }

  function renderRooms() {
    const grid = document.getElementById("rooms-grid");
    const searchVal = document.getElementById("search-room").value.toLowerCase().trim();
    const hotelVal = document.getElementById("hotel-filter").value;

    const filtered = rooms.filter(r => {
      const matchStatus = activeStatusFilter === "all" || r.status === activeStatusFilter;
      const matchHotel = hotelVal === "all" || r.hotelId === hotelVal;
      const matchSearch = !searchVal || r.roomNumber.toLowerCase().includes(searchVal) || r.name.toLowerCase().includes(searchVal);
      
      return matchStatus && matchHotel && matchSearch;
    });

    const formatVND = (v) => new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" }).format(v);

    grid.innerHTML = filtered.map(r => {
      const hName = hotels.find(h => h.id === r.hotelId)?.name || "Khách sạn Aurence";
      return `
        <div class="card">
          <div class="card-media">
            <img src="${r.image}" />
            <span class="card-badge">Phòng ${r.roomNumber}</span>
          </div>
          <div class="card-body">
            <b style="font-family:var(--font-display);font-size:1.15rem; color:var(--navy);">${r.name}</b>
            <div class="muted" style="font-size:0.75rem; margin-top:0.15rem; font-weight:600;">${hName}</div>
            <div class="muted mt-1" style="font-size:0.8rem">${r.size} · ${r.beds} · Tối đa ${r.capacity} khách</div>
            <div class="price" style="font-size:1.2rem; margin-top:0.25rem;">${formatVND(r.price)}<small> / đêm</small></div>
            <div class="flex justify-between mt-3" style="border-top: 1px solid var(--border); padding-top:0.75rem;">
              <span class="status ${getStatusClass(r.status)}">${r.status}</span>
              <div class="flex gap-2">
                <button class="btn btn-outline btn-sm" onclick="openEditRoomModal('${r.id}')">Quản lý</button>
                <button class="btn btn-ghost btn-sm" style="color:var(--danger); padding:0.25rem;" onclick="deleteRoom('${r.id}')" title="Xóa">✕</button>
              </div>
            </div>
          </div>
        </div>`;
    }).join("");
  }

  function getStatusClass(status) {
    switch (status) {
      case "Còn trống": return "confirmed";
      case "Đã đặt": return "pending";
      case "Đang sử dụng": return "occupied";
      case "Đang dọn dẹp": return "pending";
      case "Đang bảo trì": return "cancelled";
      default: return "";
    }
  }

  // Event handlers for filters
  document.querySelectorAll("#status-filter a").forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault();
    document.querySelectorAll("#status-filter a").forEach(x => x.classList.remove("active"));
    a.classList.add("active");
    activeStatusFilter = a.dataset.f;
    renderRooms();
  }));

  document.getElementById("hotel-filter").addEventListener("change", renderRooms);
  document.getElementById("search-room").addEventListener("input", renderRooms);

  // Modal setups
  const modal = document.getElementById("room-modal");
  const openModalBtn = document.getElementById("add-room-btn");
  const closeModalBtn = document.getElementById("close-modal-btn");
  const form = document.getElementById("room-form");
  const rHotelSelect = document.getElementById("r-hotel");
  const imgInput = document.getElementById("r-img-input");
  const imgPreview = document.getElementById("r-img-preview");

  openModalBtn.addEventListener("click", () => {
    form.reset();
    document.getElementById("room-edit-id").value = "";
    document.getElementById("modal-title").textContent = "Thêm phòng nghỉ mới";
    rHotelSelect.innerHTML = hotels.map(h => `<option value="${h.id}">${h.name}</option>`).join("");
    imgPreview.style.display = "none";
    currentBase64Image = "";
    modal.classList.add("open");
  });

  closeModalBtn.addEventListener("click", () => {
    modal.classList.remove("open");
  });

  // Handle Image upload
  imgInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      currentBase64Image = event.target.result;
      imgPreview.src = currentBase64Image;
      imgPreview.style.display = "block";
    };
    reader.readAsDataURL(file);
  });

  // Open Edit Room Modal
  window.openEditRoomModal = function(roomId) {
    const r = rooms.find(x => x.id === roomId);
    if (!r) return;

    document.getElementById("room-edit-id").value = r.id;
    document.getElementById("modal-title").textContent = `Quản lý phòng ${r.roomNumber}`;
    
    rHotelSelect.innerHTML = hotels.map(h => `<option value="${h.id}" ${h.id === r.hotelId ? 'selected' : ''}>${h.name}</option>`).join("");
    document.getElementById("r-num").value = r.roomNumber;
    document.getElementById("r-name").value = r.name;
    document.getElementById("r-size").value = r.size;
    document.getElementById("r-beds").value = r.beds;
    document.getElementById("r-capacity").value = r.capacity;
    document.getElementById("r-price").value = r.price;
    document.getElementById("r-status").value = r.status;

    // Image preview
    currentBase64Image = r.image;
    imgPreview.src = r.image;
    imgPreview.style.display = "block";

    modal.classList.add("open");
  };

  // Delete Room
  window.deleteRoom = function(roomId) {
    if (!confirm("Bạn có chắc chắn muốn xóa phòng nghỉ này?")) return;

    rooms = rooms.filter(x => x.id !== roomId);
    LS.set("aurence.rooms", rooms);
    
    toast("Đã xóa phòng nghỉ thành công.");
    loadRoomsData();
  };

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast show";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  // Form Submit
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    
    const editId = document.getElementById("room-edit-id").value;
    const roomNumber = document.getElementById("r-num").value.trim();
    const hotelId = rHotelSelect.value;
    const name = document.getElementById("r-name").value.trim();
    const size = document.getElementById("r-size").value.trim();
    const beds = document.getElementById("r-beds").value.trim();
    const capacity = parseInt(document.getElementById("r-capacity").value);
    const price = parseFloat(document.getElementById("r-price").value);
    const status = document.getElementById("r-status").value;

    if (!currentBase64Image) {
      alert("Vui lòng tải lên ảnh đại diện phòng nghỉ.");
      return;
    }

    if (editId) {
      // Edit
      const rIdx = rooms.findIndex(x => x.id === editId);
      if (rIdx > -1) {
        rooms[rIdx] = {
          ...rooms[rIdx],
          roomNumber, hotelId, name, size, beds, capacity, price, status,
          image: currentBase64Image
        };
      }
    } else {
      // Add
      const newId = "RM" + Math.floor(100 + Math.random() * 900);
      rooms.push({
        id: newId,
        roomNumber, hotelId, name, size, beds, capacity, price, status,
        image: currentBase64Image
      });
    }

    LS.set("aurence.rooms", rooms);
    modal.classList.remove("open");
    toast(editId ? "Đã cập nhật thông tin phòng." : "Đã thêm phòng nghỉ mới thành công.");
    loadRoomsData();
  });

  // Initial trigger
  loadRoomsData();
</script>
</body>
</html>
