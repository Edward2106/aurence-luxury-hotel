<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quản lý Phản hồi — Admin Aurence</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .filter-row { display: flex; gap: 0.75rem; margin-top: 1rem; align-items: center; }
  .rating-badge { color: var(--gold); font-weight: 600; font-size: 1.1rem; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 21, 48, 0.7);
    display: none; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 20px; padding: 2rem; max-width: 500px; width: 90%;
    box-shadow: var(--shadow-luxe); border: 1px solid var(--border);
  }
</style>
</head>
<body data-admin="reviews" data-no-concierge>
<div class="admin-shell"><div data-admin-nav></div>
<main class="admin-main">
  <div class="admin-head">
    <div><div class="eyebrow">Phản hồi khách hàng</div><h1>Đánh giá của khách</h1></div>
  </div>

  <div class="filter-row">
    <select class="select" id="rating-filter" style="max-width:200px;">
      <option value="all">Tất cả xếp hạng</option>
      <option value="5">5 sao ★★★★★</option>
      <option value="4">4 sao ★★★★☆</option>
      <option value="3">3 sao và thấp hơn</option>
    </select>
    <input class="input" id="search-rev" placeholder="Tìm tác giả, khách sạn..." style="max-width:250px; margin-left:auto;" />
  </div>

  <div class="grid grid-2 mt-3" id="rev-grid"></div>
</main>
</div>

<!-- Details Modal -->
<div class="modal-overlay" id="rev-details-modal">
  <div class="modal-box">
    <h3 style="color:var(--navy); margin-bottom:1rem;">Chi tiết xếp hạng đánh giá</h3>
    <div style="background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:1.25rem; font-size:0.9rem;" class="muted">
      <div class="flex justify-between" style="padding:0.25rem 0"><span>Khách hàng:</span><b id="d-author"></b></div>
      <div class="flex justify-between" style="padding:0.25rem 0"><span>Khách sạn:</span><b id="d-hotel"></b></div>
      <div class="flex justify-between" style="padding:0.25rem 0"><span>Thời gian gửi:</span><b id="d-date"></b></div>
      
      <div class="mt-2 pt-2" style="border-top: 1px dashed var(--border);">
        <div class="flex justify-between" style="padding:0.15rem 0"><span>Trải nghiệm tổng thể:</span><b id="ds-overall"></b></div>
        <div class="flex justify-between" style="padding:0.15rem 0"><span>Chất lượng phòng:</span><b id="ds-room"></b></div>
        <div class="flex justify-between" style="padding:0.15rem 0"><span>Độ sạch sẽ:</span><b id="ds-clean"></b></div>
        <div class="flex justify-between" style="padding:0.15rem 0"><span>Nhân viên phục vụ:</span><b id="ds-staff"></b></div>
        <div class="flex justify-between" style="padding:0.15rem 0"><span>Nhà hàng ẩm thực:</span><b id="ds-dining"></b></div>
        <div class="flex justify-between" style="padding:0.15rem 0"><span>Dịch vụ khách sạn:</span><b id="ds-service"></b></div>
      </div>
      
      <div class="mt-2 pt-2" style="border-top:1px dashed var(--border);">
        <b>Nội dung nhận xét:</b>
        <p id="d-comment" style="font-style:italic; margin-top:0.25rem; font-size:0.85rem; line-height: 1.4;"></p>
      </div>

      <div class="mt-2" id="d-photos-box">
        <b>Ảnh đính kèm:</b>
        <div id="d-photos-list" style="display:flex; gap:0.5rem; margin-top:0.25rem;"></div>
      </div>
    </div>
    <div class="mt-4 flex gap-2 justify-end">
      <button class="btn btn-navy" onclick="closeDetailsModal()">Đóng</button>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  const { LS } = AURENCE;
  
  let reviews = [];

  function fixImgPath(path) {
    if (!path) return "";
    if (path.startsWith("data:") || path.startsWith("http") || path.startsWith("../")) return path;
    return "../" + path;
  }

  function loadReviewsData() {
    reviews = LS.get("aurence.reviews", AURENCE.reviews);
    render();
  }

  function render() {
    const grid = document.getElementById("rev-grid");
    const searchVal = document.getElementById("search-rev").value.toLowerCase().trim();
    const rateVal = document.getElementById("rating-filter").value;

    const filtered = reviews.filter(r => {
      const matchSearch = !searchVal || r.author.toLowerCase().includes(searchVal) || r.hotelName.toLowerCase().includes(searchVal);
      
      let matchRate = true;
      if (rateVal === "5") matchRate = r.rating === 5;
      else if (rateVal === "4") matchRate = r.rating === 4;
      else if (rateVal === "3") matchRate = r.rating <= 3;

      return matchSearch && matchRate;
    });

    grid.innerHTML = filtered.map(r => {
      const stars = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
      const isHidden = r.hidden || false;
      const visibilityText = isHidden ? "Hiện đánh giá" : "Ẩn đánh giá";
      const visibilityClass = isHidden ? "btn-outline" : "btn-ghost";
      const statusBadge = isHidden ? `<span class="status cancelled" style="margin-left:0.5rem;">Đang ẩn</span>` : `<span class="status confirmed" style="margin-left:0.5rem;">Hiển thị</span>`;

      return `
        <div class="card" style="padding:1.75rem">
          <div class="flex justify-between">
            <div>
              <b>${r.author}</b>
              <div class="muted" style="font-size:0.75rem;">${r.hotelName}</div>
            </div>
            <div style="text-align:right;">
              <span class="rating-badge">${stars}</span>
              <div>${statusBadge}</div>
            </div>
          </div>
          <div class="muted" style="font-size:0.8rem; margin-top:0.25rem;">Gửi lúc: ${r.date}</div>
          <p class="mt-2" style="font-size:0.9rem; line-height: 1.45; min-height: 45px;">"${r.text}"</p>
          
          <div class="flex gap-2 mt-3" style="border-top:1px solid var(--border); padding-top:0.75rem;">
            <button class="btn btn-outline btn-sm" onclick="viewDetails('${r.id}')">Chi tiết</button>
            <button class="btn ${visibilityClass} btn-sm" onclick="toggleVisibility('${r.id}')">${visibilityText}</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger); margin-left:auto;" onclick="deleteReview('${r.id}')">Xóa</button>
          </div>
        </div>`;
    }).join("");
  }

  document.getElementById("search-rev").addEventListener("input", render);
  document.getElementById("rating-filter").addEventListener("change", render);

  // Toggle Visibility
  window.toggleVisibility = function(id) {
    const r = reviews.find(x => x.id === id);
    if (b => b.id === id) {
      r.hidden = !r.hidden;
      LS.set("aurence.reviews", reviews);
      
      toast(r.hidden ? "Đã ẩn đánh giá khỏi giao diện khách." : "Đã kích hoạt hiển thị đánh giá công khai.");
      render();
    }
  };

  // Delete review
  window.deleteReview = function(id) {
    if (!confirm("Bạn có chắc chắn muốn xóa đánh giá này? Hành động này không thể hoàn tác.")) return;
    
    reviews = reviews.filter(r => r.id !== id);
    LS.set("aurence.reviews", reviews);
    
    toast("Đã xóa đánh giá thành công.");
    loadReviewsData();
  };

  // View Details Modal
  const modal = document.getElementById("rev-details-modal");

  window.viewDetails = function(id) {
    const r = reviews.find(x => x.id === id);
    if (!r) return;

    document.getElementById("d-author").textContent = r.author;
    document.getElementById("d-hotel").textContent = r.hotelName;
    document.getElementById("d-date").textContent = r.date;
    document.getElementById("d-comment").textContent = `"${r.text}"`;

    // Subratings
    const sub = r.ratings || { overall: r.rating, room: 5, clean: 5, staff: 5, dining: 5, service: 5 };
    const stars = (v) => "★".repeat(v) + "☆".repeat(5-v);
    
    document.getElementById("ds-overall").textContent = stars(sub.overall);
    document.getElementById("ds-room").textContent = stars(sub.room);
    document.getElementById("ds-clean").textContent = stars(sub.clean);
    document.getElementById("ds-staff").textContent = stars(sub.staff);
    document.getElementById("ds-dining").textContent = stars(sub.dining);
    document.getElementById("ds-service").textContent = stars(sub.service);

    // Photos list
    const pBox = document.getElementById("d-photos-box");
    const pList = document.getElementById("d-photos-list");
    const imgs = r.images || [];

    if (imgs.length === 0) {
      pBox.style.display = "none";
    } else {
      pBox.style.display = "block";
      pList.innerHTML = imgs.map(src => `
        <img src="${fixImgPath(src)}" style="width:70px; height:70px; object-fit:cover; border-radius:6px; border:1px solid var(--border);" onclick="window.open('${fixImgPath(src)}')" class="cursor-pointer" />
      `).join("");
    }

    modal.classList.add("open");
  };

  window.closeDetailsModal = function() {
    modal.classList.remove("open");
  };

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast show";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  // Initial trigger
  loadReviewsData();
</script>
</body>
</html>
