<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Settings — Admin</title><link rel="stylesheet" href="../assets/css/style.css" /></head>
<body data-admin="settings" data-no-concierge>
<div class="admin-shell"><div data-admin-nav></div>
<main class="admin-main">
<div class="admin-head"><div><div class="eyebrow">Configuration</div><h1>Settings</h1></div><button class="btn btn-primary" id="save">Save changes</button></div>

<div class="grid grid-2">
  <div class="card" style="padding:2rem">
    <h3>Organisation</h3>
    <div class="field mt-2"><label>Brand name</label><input class="input" value="Aurence Collection" /></div>
    <div class="field mt-2"><label>Support email</label><input class="input" value="care@aurence.com" /></div>
    <div class="field mt-2"><label>Default currency</label><select class="select"><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option></select></div>
    <div class="field mt-2"><label>Language</label><select class="select"><option>English</option><option>Français</option><option>日本語</option></select></div>
  </div>
  <div class="card" style="padding:2rem">
    <h3>Notifications</h3>
    <label class="check-row mt-2"><input type="checkbox" checked /> Email booking confirmations</label>
    <label class="check-row"><input type="checkbox" checked /> SMS check-in reminders</label>
    <label class="check-row"><input type="checkbox" /> Marketing newsletter</label>
    <label class="check-row"><input type="checkbox" checked /> Post-stay review requests</label>
    <h3 class="mt-3">Security</h3>
    <label class="check-row mt-2"><input type="checkbox" checked /> Two-factor authentication</label>
    <label class="check-row"><input type="checkbox" checked /> Session timeout (30 min)</label>
    <button class="btn btn-outline mt-3">Rotate API keys</button>
  </div>
</div>
</main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/admin.js"></script>
<script>
  document.getElementById("save").addEventListener("click", () => { toast && toast("Settings saved."); });
  window.toast = (m) => { const t = document.createElement("div"); t.className="toast show"; t.textContent = m; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); };
</script>
</body></html>
