<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title id="doc-title">Khách sạn — Bộ sưu tập Aurence</title>
<meta name="description" content="Khám phá các phòng nghỉ, dịch vụ tiện ích và đặt chỗ lưu trú tại bộ sưu tập khách sạn Aurence." />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="hotels">
<div data-nav></div>

<main class="container" style="padding-top:6rem; min-height: 80vh;" id="root"></main>

<div data-footer></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  const { LS } = AURENCE;
  
  // Load data dynamically from storage
  const hotelsList = LS.get("aurence.hotels", AURENCE.hotels);
  const roomsList = LS.get("aurence.rooms", AURENCE.rooms);
  const reviewsList = LS.get("aurence.reviews", AURENCE.reviews);
  const settings = LS.get("aurence.settings", { taxRate: 10, serviceFeeRate: 5 });

  const id = new URLSearchParams(location.search).get("id") || (hotelsList[0] ? hotelsList[0].id : "");
  const h = hotelsList.find(x => x.id === id);

  const root = document.getElementById("root");

  if (!h) {
    // Show a friendly error if the hotel ID does not exist
    root.innerHTML = `
      <div style="text-align:center; padding:5rem 0">
        <h2 class="text-gold">Không tìm thấy khách sạn</h2>
        <p class="muted mt-2">Yêu cầu của bạn không khớp với bất kỳ cơ sở lưu trú nào trong Bộ sưu tập Aurence.</p>
        <a href="hotels.html" class="btn btn-navy mt-3">Quay lại danh sách</a>
      </div>
    `;
  } else {
    document.getElementById("doc-title").textContent = h.name + " — Bộ sưu tập Aurence";
    
    // Filter rooms and reviews by hotel
    const hotelRooms = roomsList.filter(r => r.hotelId === h.id);
    const hotelReviews = reviewsList.filter(r => r.hotelId === h.id && !r.hidden);
    
    // Check if favorited
    const profile = LS.get("aurence.profile", {});
    const favorites = profile.favorites || [];
    const isFav = favorites.includes(h.id);

    // Get search data from localStorage if available
    const searchData = LS.get("aurence.search") || {};
    const defaultCheckIn = searchData.checkIn || new Date().toISOString().split("T")[0];
    
    // Default check-out is tomorrow
    let defaultCheckOut = searchData.checkOut || "";
    if (!defaultCheckOut) {
      const tom = new Date();
      tom.setDate(tom.getDate() + 1);
      defaultCheckOut = tom.toISOString().split("T")[0];
    }
    
    const defaultGuests = searchData.guests || 2;

    root.innerHTML = `
      <div class="fade-up" style="margin-bottom:1rem">
        <a href="hotels.html" class="muted" style="font-size:0.85rem">← Quay lại danh sách khách sạn</a>
      </div>
      <div class="section-head">
        <div>
          <div class="eyebrow">${h.country}</div>
          <h1 style="margin-top:0.5rem">${h.name}</h1>
          <div class="muted mt-1">◉ ${h.location} · ${"★".repeat(h.stars)} · ${h.rating} (${h.reviews} đánh giá)</div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-outline" id="fav-detail-btn">${isFav ? "♥ Đã thích" : "♡ Yêu thích"}</button>
          <button class="btn btn-outline" id="share-detail-btn">↗ Chia sẻ</button>
        </div>
      </div>
      <div class="gallery mt-3 fade-up">
        ${h.gallery && h.gallery.length > 0 
          ? h.gallery.map(g => `<img src="${g}" alt="" loading="lazy" />`).join("")
          : `<img src="${h.image}" alt="" style="grid-column: span 3; width: 100%; aspect-ratio: 2/1;" />`
        }
      </div>

      <div class="detail-layout">
        <div>
          <div class="tabs">
            <button class="tab active" data-tab="overview">Tổng quan</button>
            <button class="tab" data-tab="rooms">Loại phòng</button>
            <button class="tab" data-tab="facilities">Tiện nghi</button>
            <button class="tab" data-tab="reviews">Đánh giá (${hotelReviews.length})</button>
          </div>

          <section data-panel="overview">
            <h3>Không gian nghỉ dưỡng yên bình</h3>
            <p class="muted mt-1">${h.description}</p>
            <h3 class="mt-3">Điểm nhấn nổi bật</h3>
            <div class="grid grid-2 mt-2">
              ${["Dịch vụ quản gia riêng biệt", "Trải nghiệm ẩm thực Michelin", "Liệu trình Spa thư giãn tại phòng", "Lối đi bãi biển riêng tư"].map(x => `<div class="chip" style="padding:0.75rem 1rem">✦ ${x}</div>`).join("")}
            </div>
          </section>

          <section data-panel="rooms" hidden>
            ${hotelRooms.length > 0 ? hotelRooms.map(r => {
              const priceFormatted = window.formatVND ? window.formatVND(r.price) : (r.price.toLocaleString() + " ₫");
              return `
                <div class="room-item">
                  <img src="${r.image}" alt="${r.name}" />
                  <div>
                    <b style="font-family:var(--font-display);font-size:1.15rem">${r.name}</b>
                    <div class="muted mt-1">${r.size} · ${r.beds} · Sức chứa: Tối đa ${r.capacity} khách</div>
                    <div class="mt-1" style="font-size:0.85rem">Phục vụ ăn sáng miễn phí tại phòng, tủ lạnh mini bar cao cấp và dịch vụ giặt là nhanh.</div>
                  </div>
                  <div style="text-align:right">
                    <div class="price">${priceFormatted}<small> / đêm</small></div>
                    <button class="btn btn-navy btn-sm mt-1" onclick="selectRoom('${r.id}')">Đặt phòng</button>
                  </div>
                </div>`;
            }).join("") : `<div class="muted">Khách sạn đang cập nhật danh sách phòng.</div>`}
          </section>

          <section data-panel="facilities" hidden>
            <div class="grid grid-3">
              ${h.facilities.map(f => `<div class="chip" style="padding:1rem;text-align:center">${f}</div>`).join("")}
            </div>
          </section>

          <section data-panel="reviews" hidden>
            <div class="grid grid-2">
              ${hotelReviews.length > 0 ? hotelReviews.map(r => `
                <div class="testimonial">
                  <div class="rating">${"★".repeat(r.rating)}</div>
                  <p class="mt-1">${r.text}</p>
                  <div class="muted mt-2" style="font-size:0.8rem"><b style="color:var(--text)">${r.author}</b> · ${r.date}</div>
                </div>`).join("") : `<div class="muted" style="padding: 2rem 0;">Chưa có đánh giá nào cho khách sạn này.</div>`}
            </div>
          </section>
        </div>

        <aside class="booking-box">
          <div class="price" id="box-price">${window.formatVND ? window.formatVND(h.price) : (h.price.toLocaleString() + " ₫")}<small> / đêm</small></div>
          <div class="rating mt-1">${"★".repeat(h.stars)} <span class="muted" style="font-size:0.8rem">${h.rating} · ${h.reviews} đánh giá</span></div>
          
          <div class="field mt-2"><label>Ngày nhận phòng</label><input type="date" class="input" id="ci" value="${defaultCheckIn}" /></div>
          <div class="field mt-2"><label>Ngày trả phòng</label><input type="date" class="input" id="co" value="${defaultCheckOut}" /></div>
          <div class="field mt-2"><label>Số khách</label>
            <select class="select" id="gs">
              <option value="1" ${defaultGuests == 1 ? "selected" : ""}>1 người lớn</option>
              <option value="2" ${defaultGuests == 2 ? "selected" : ""}>2 người lớn</option>
              <option value="3" ${defaultGuests == 3 ? "selected" : ""}>3 khách (2 lớn, 1 trẻ em)</option>
              <option value="4" ${defaultGuests == 4 ? "selected" : ""}>4 người lớn</option>
            </select>
          </div>
          
          <div id="price-breakdown" class="mt-3">
            <div class="row"><span><span id="lbl-nights">1</span> đêm × <span id="lbl-price">${window.formatVND(h.price)}</span></span><b id="val-subtotal"></b></div>
            <div class="row"><span>Phí dịch vụ (${settings.serviceFeeRate}%)</span><b id="val-service"></b></div>
            <div class="row"><span>Thuế GTGT (${settings.taxRate}%)</span><b id="val-tax"></b></div>
            <div class="row" style="border-top:1px solid var(--border);margin-top:0.5rem;padding-top:0.75rem"><b>Tổng cộng</b><b id="val-total" style="font-family:var(--font-display);font-size:1.25rem"></b></div>
          </div>
          
          <button class="btn btn-primary btn-block btn-lg mt-3" id="book-btn">Đặt kỳ nghỉ ngay</button>
          <div class="muted text-center mt-2" style="font-size:0.75rem">Hủy phòng miễn phí trước ngày nhận 48 giờ.</div>
        </aside>
      </div>
    `;

    // Tab Navigation
    document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== t.dataset.tab);
    }));

    // Favorite details
    const favBtn = document.getElementById("fav-detail-btn");
    favBtn.addEventListener("click", () => {
      const prof = LS.get("aurence.profile", {});
      if (!prof.favorites) prof.favorites = [];
      const idx = prof.favorites.indexOf(h.id);
      if (idx > -1) {
        prof.favorites.splice(idx, 1);
        toast("Đã xóa khỏi danh sách yêu thích");
        favBtn.textContent = "♡ Yêu thích";
      } else {
        prof.favorites.push(h.id);
        toast("Đã thêm vào danh sách yêu thích");
        favBtn.textContent = "♥ Đã thích";
      }
      LS.set("aurence.profile", prof);
    });

    // Share details
    document.getElementById("share-detail-btn").addEventListener("click", () => {
      const shareUrl = window.location.href;
      navigator.clipboard.writeText(shareUrl).then(() => {
        toast("Đã sao chép liên kết vào khay nhớ tạm!");
      }).catch(() => {
        toast("Sao chép: " + shareUrl);
      });
    });

    // Dynamic price calculation
    const ciInput = document.getElementById("ci");
    const coInput = document.getElementById("co");
    const gsSelect = document.getElementById("gs");

    // Set min date to today
    const todayStr = new Date().toISOString().split("T")[0];
    ciInput.min = todayStr;
    
    ciInput.addEventListener("change", () => {
      coInput.min = ciInput.value;
      if (new Date(coInput.value) <= new Date(ciInput.value)) {
        const nextDay = new Date(ciInput.value);
        nextDay.setDate(nextDay.getDate() + 1);
        coInput.value = nextDay.toISOString().split("T")[0];
      }
      recalc();
    });
    coInput.addEventListener("change", recalc);
    
    function recalc() {
      const ci = ciInput.value;
      const co = coInput.value;
      if (!ci || !co) return;

      const d1 = new Date(ci);
      const d2 = new Date(co);
      let diff = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
      if (diff <= 0) diff = 1;

      document.getElementById("lbl-nights").textContent = diff;
      
      const subtotal = h.price * diff;
      const serviceFee = Math.round(subtotal * (settings.serviceFeeRate / 100));
      const tax = Math.round(subtotal * (settings.taxRate / 100));
      const total = subtotal + serviceFee + tax;

      document.getElementById("val-subtotal").textContent = window.formatVND(subtotal);
      document.getElementById("val-service").textContent = window.formatVND(serviceFee);
      document.getElementById("val-tax").textContent = window.formatVND(tax);
      document.getElementById("val-total").textContent = window.formatVND(total);
    }
    recalc(); // initial calculation

    // Booking from the side box (with default/first room or no room assigned yet)
    document.getElementById("book-btn").addEventListener("click", () => {
      const ci = ciInput.value;
      const co = coInput.value;
      const guests = parseInt(gsSelect.value) || 2;

      if (!ci || !co) {
        toast("Vui lòng chọn ngày nhận/trả phòng.");
        return;
      }
      if (new Date(co) <= new Date(ci)) {
        toast("Ngày trả phòng phải sau ngày nhận phòng.");
        return;
      }

      // Automatically select the first room of this hotel for draft booking
      const firstRoom = hotelRooms[0];
      if (!firstRoom) {
        toast("Không tìm thấy phòng trống tại khách sạn này.");
        return;
      }

      const d1 = new Date(ci);
      const d2 = new Date(co);
      let diff = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
      if (diff <= 0) diff = 1;

      const subtotal = firstRoom.price * diff;
      const serviceFee = Math.round(subtotal * (settings.serviceFeeRate / 100));
      const tax = Math.round(subtotal * (settings.taxRate / 100));
      const total = subtotal + serviceFee + tax;

      LS.set("aurence.bookingDraft", {
        hotelId: h.id,
        hotelName: h.name,
        roomId: firstRoom.id,
        roomName: firstRoom.name,
        checkIn: ci,
        checkOut: co,
        guests: guests,
        nights: diff,
        price: firstRoom.price,
        serviceFee: serviceFee,
        tax: tax,
        discount: 0,
        total: total
      });

      location.href = `booking.html?hotel=${h.id}&room=${firstRoom.id}`;
    });
  }

  // Room item selection handler
  window.selectRoom = function(roomId) {
    const ci = document.getElementById("ci").value;
    const co = document.getElementById("co").value;
    const guests = parseInt(document.getElementById("gs").value) || 2;

    if (!ci || !co) {
      toast("Vui lòng chọn ngày nhận/trả phòng ở hộp bên phải trước.");
      return;
    }
    if (new Date(co) <= new Date(ci)) {
      toast("Ngày trả phòng phải sau ngày nhận phòng.");
      return;
    }

    const roomsList = LS.get("aurence.rooms", AURENCE.rooms);
    const targetRoom = roomsList.find(r => r.id === roomId);
    if (!targetRoom) {
      toast("Lỗi: Không tìm thấy loại phòng này.");
      return;
    }

    if (guests > targetRoom.capacity) {
      toast(`Số khách (${guests}) vượt quá sức chứa tối đa của phòng này (${targetRoom.capacity} khách).`);
      return;
    }

    const d1 = new Date(ci);
    const d2 = new Date(co);
    let diff = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
    if (diff <= 0) diff = 1;

    const settings = LS.get("aurence.settings", { taxRate: 10, serviceFeeRate: 5 });
    const subtotal = targetRoom.price * diff;
    const serviceFee = Math.round(subtotal * (settings.serviceFeeRate / 100));
    const tax = Math.round(subtotal * (settings.taxRate / 100));
    const total = subtotal + serviceFee + tax;

    LS.set("aurence.bookingDraft", {
      hotelId: h.id,
      hotelName: h.name,
      roomId: targetRoom.id,
      roomName: targetRoom.name,
      checkIn: ci,
      checkOut: co,
      guests: guests,
      nights: diff,
      price: targetRoom.price,
      serviceFee: serviceFee,
      tax: tax,
      discount: 0,
      total: total
    });

    location.href = `booking.html?hotel=${h.id}&room=${targetRoom.id}`;
  };
</script>
</body>
</html>
