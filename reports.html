<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Reports — Admin</title><link rel="stylesheet" href="../assets/css/style.css" /></head>
<body data-admin="reports" data-no-concierge>
<div class="admin-shell"><div data-admin-nav></div>
<main class="admin-main">
<div class="admin-head"><div><div class="eyebrow">Analytics</div><h1>Reports</h1></div>
  <select class="select" style="width:200px"><option>Last 30 days</option><option>Last quarter</option><option>Year to date</option></select>
</div>
<div class="grid grid-4">
  <div class="stat"><div class="lbl">Total revenue</div><div class="val">$4.82M</div><div class="trend">+18% YoY</div></div>
  <div class="stat"><div class="lbl">Bookings</div><div class="val">3,247</div><div class="trend">+12%</div></div>
  <div class="stat"><div class="lbl">Avg. rating</div><div class="val">4.88</div><div class="trend">+0.04</div></div>
  <div class="stat"><div class="lbl">Cancellation</div><div class="val">2.1%</div><div class="trend">-0.4pt</div></div>
</div>

<div class="grid grid-2 mt-4">
  <div class="card" style="padding:1.5rem">
    <h3>Top performing hotels</h3>
    <div class="bar-chart mt-3" id="bars"></div>
  </div>
  <div class="card" style="padding:1.5rem">
    <h3>Customer mix</h3>
    <div class="flex items-center gap-4 mt-3">
      <svg viewBox="0 0 100 100" style="width:180px;height:180px">
        <circle r="45" cx="50" cy="50" fill="var(--navy)" />
        <circle r="45" cx="50" cy="50" fill="transparent" stroke="var(--gold)" stroke-width="90" stroke-dasharray="calc(45 * 0.42) 999" transform="rotate(-90 50 50)" />
        <circle r="45" cx="50" cy="50" fill="transparent" stroke="var(--gold-2)" stroke-width="90" stroke-dasharray="calc(45 * 0.28) 999" stroke-dashoffset="calc(-45 * 0.42)" transform="rotate(-90 50 50)" />
      </svg>
      <div>
        <div class="flex items-center gap-2"><span style="width:12px;height:12px;background:var(--navy);border-radius:3px"></span>Leisure — 42%</div>
        <div class="flex items-center gap-2 mt-1"><span style="width:12px;height:12px;background:var(--gold);border-radius:3px"></span>Business — 28%</div>
        <div class="flex items-center gap-2 mt-1"><span style="width:12px;height:12px;background:var(--gold-2);border-radius:3px"></span>Events — 18%</div>
        <div class="flex items-center gap-2 mt-1"><span style="width:12px;height:12px;background:var(--gold-soft);border-radius:3px"></span>Groups — 12%</div>
      </div>
    </div>
  </div>
</div>
</main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/admin.js"></script>
<script>
  const vals = [98,84,79,72,68,54];
  document.getElementById("bars").innerHTML = AURENCE.hotels.map((h,i) => `<div class="bar" style="height:${vals[i]*1.8}px"><b>${vals[i]}</b><span>${h.name.split(" ")[0]}</span></div>`).join("");
</script>
</body></html>
